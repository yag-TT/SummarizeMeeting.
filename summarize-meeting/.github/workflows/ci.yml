name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Ubuntu runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fontconfig fonts-noto-cjk \
            libasound2 libegl1 libgl1 libportaudio2 libpulse0
      - run: uv sync --frozen
      - name: Verify sherpa-onnx platform dependency
        run: uv run --frozen python -c "import importlib.metadata, sys; import sherpa_onnx; from summarize_meeting.processing.sherpa_runtime import sherpa_cuda_status; version = importlib.metadata.version('sherpa-onnx'); linux = sys.platform.startswith('linux'); assert ('+cuda12.cudnn9' in version) if linux else (version == '1.13.2'); assert not sherpa_cuda_status().available if linux else True; print(version)"
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q
