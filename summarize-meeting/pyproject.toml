[project]
name = "summarize-meeting"
version = "0.1.0"
description = "Local-first desktop application for recording and generating meeting minutes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=18.0.0",
    "faster-whisper>=1.2.1",
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "onnxruntime==1.24.4",
    "opencv-python-headless>=5.0.0.93",
    "pyside6>=6.11.1",
    "sherpa-onnx==1.13.2",
    "sherpa-onnx-core==1.13.2; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "soundcard>=0.4.6",
    "sounddevice>=0.5.5",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-foundation-collections>=3.2.1,<4",
    "winrt-windows-globalization>=3.2.1,<4",
    "winrt-windows-graphics>=3.2.1",
    "winrt-windows-graphics-capture>=3.2.1",
    "winrt-windows-graphics-capture-interop>=3.2.1",
    "winrt-windows-graphics-directx>=3.2.1",
    "winrt-windows-graphics-directx-direct3d11>=3.2.1",
    "winrt-windows-graphics-directx-direct3d11-interop>=3.2.1",
    "winrt-windows-graphics-imaging>=3.2.1",
    "winrt-windows-media-ocr>=3.2.1,<4",
    "winrt-windows-storage-streams>=3.2.1",
]

[project.scripts]
summarize-meeting = "summarize_meeting:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.2",
]
