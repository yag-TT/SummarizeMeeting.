[project]
name = "summarize-meeting"
version = "0.1.0"
description = "Local-first desktop application for recording and generating meeting minutes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=18.0.0",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=0.34",
    "numpy>=2.2,<2.4",
    "onnxruntime==1.24.4",
    "paddleocr==3.7.0",
    "psutil>=7.0",
    "pyside6>=6.11.1",
    "sherpa-onnx==1.13.4+cuda12.cudnn9; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sherpa-onnx==1.13.2; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "sherpa-onnx-core==1.13.2; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "soundcard>=0.4.6",
    "sounddevice>=0.5.5",
]

[project.scripts]
summarize-meeting = "summarize_meeting:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
find-links = ["https://k2-fsa.github.io/sherpa/onnx/cuda.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.2",
]
